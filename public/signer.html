<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wallet · Xahau</title>
<style>
  html:not([data-theme]),
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0c0f14;
    --surface: #151b24;
    --surface-2: #1c2633;
    --text: #e9eef5;
    --muted: #93a0b5;
    --line: #243041;
    --accent: #8dffc1;
    --accent-ink: #042;
    --danger: #ff8f8f;
    --warn: #ffd38a;
    --focus: #8dffc1;
    --ghost: #8dffc1;
    --ghost-border: #245c40;
    --nav: #10151c;
  }
  html[data-theme="light"] {
    color-scheme: light;
    --bg: #f4f6f8;
    --surface: #ffffff;
    --surface-2: #e6edf3;
    --text: #14181f;
    --muted: #4e5d6e;
    --line: #d5dee7;
    --accent: #0e7a45;
    --accent-ink: #ffffff;
    --danger: #a32020;
    --warn: #8a5a00;
    --focus: #0e7a45;
    --ghost: #0e7a45;
    --ghost-border: #8fbfa6;
    --nav: #ffffff;
  }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 1rem/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  #shell { min-height: 100vh; }
  main { max-width: 32rem; margin: 0 auto; padding: 1.25rem 1rem 2rem; }
  h1 { margin: 0; font-size: 1.35rem; font-weight: 650; line-height: 1.2; letter-spacing: -0.02em; }
  h2 { margin: 0 0 0.6rem; color: var(--text); font-size: 0.95rem; font-weight: 650; line-height: 1.3; }
  p { margin: .4rem 0; }
  button, .go { display: block; width: 100%; box-sizing: border-box; margin: .7rem 0; padding: .9rem 1rem; border: 0; border-radius: .8rem; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 700; text-align: center; cursor: pointer; }
  button.ghost { background: transparent; color: var(--ghost); border: 1px solid var(--ghost-border); }
  button.link { width: auto; margin: .7rem 0; padding: 0; background: none; color: var(--accent); font-weight: 650; }
  button:disabled { opacity: .55; }
  button.tab { appearance: none; -webkit-appearance: none; width: auto; margin: 0; background: transparent; color: var(--muted); border: 0; font-weight: 650; border-radius: .7rem; line-height: 1.1; }
  button.tab.on { background: var(--accent); color: var(--accent-ink); }
  #nav[hidden] { display: none !important; }
  input[type="text"], input[type="password"], select { width: 100%; box-sizing: border-box; margin: .35rem 0; padding: .75rem; border-radius: .7rem; border: 1px solid var(--line); background: var(--surface); color: inherit; font: inherit; }
  label { display: flex; gap: .6rem; align-items: flex-start; margin: .8rem 0; }
  .muted { color: var(--muted); font-size: 0.8125rem; font-weight: 400; line-height: 1.4; }
  .warn { color: var(--warn); }
  .lede { font-size: 1.05rem; }
  .balance { margin: .15rem 0 .2rem; font-size: 2.5rem; font-weight: 650; line-height: 1.05; letter-spacing: -0.03em; }
  .balance span { font-size: 1rem; font-weight: 650; color: var(--muted); }
  .addr { display: flex; align-items: center; gap: .6rem; margin: .2rem 0 .4rem; }
  .addr .mono { flex: 1; min-width: 0; font-size: .78rem; }
  .addr button { width: auto; margin: 0; padding: .4rem .7rem; font-size: .85rem; }
  .banner { display: flex; align-items: center; justify-content: space-between; gap: .8rem; margin: .8rem 0; padding: .75rem .9rem; border-radius: .9rem; background: var(--surface-2); border: 1px solid var(--line); }
  .banner p { margin: 0; }
  .banner button { width: auto; margin: 0; padding: .55rem .9rem; }
  .tx-head { display: none; }
  .tx {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "type end" "main end";
    column-gap: 0.75rem;
    row-gap: 0.12rem;
    align-items: baseline;
    box-sizing: border-box;
    margin: 0;
    padding: 0.7rem 0;
    border: 0;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    background: transparent;
    color: inherit;
    font-weight: 400;
    text-decoration: none;
  }
  a.tx { cursor: pointer; color: inherit; text-decoration: none; }
  .tx-type { grid-area: type; font-weight: 650; font-size: 1rem; color: var(--text); }
  .tx-main {
    grid-area: main;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 0.8125rem;
    line-height: 1.35;
    color: var(--muted);
    font-weight: 400;
  }
  html[data-shell="phone"] .tx-main:empty { display: none; }
  .tx-end { grid-area: end; display: flex; align-items: baseline; justify-content: flex-end; gap: 0.45rem; white-space: nowrap; }
  .tx-hash { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.75rem; font-weight: 400; color: var(--muted); }
  .tx-flag { font-size: 0.75rem; font-weight: 650; color: var(--danger); }
  .tx.bad .tx-type { color: var(--danger); }
  a.tx:hover { background: var(--surface-2); color: inherit; text-decoration: none; }
  a.tx:active { background: var(--line); color: inherit; }
  a.tx:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .lines { list-style: none; margin: 0 0 .35rem; padding: 0; }
  .lines:empty { display: none; }
  .lines li { font-size: .95rem; font-weight: 650; }
  p a, li a {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 0.12rem;
    text-decoration-color: var(--line);
  }
  .qrbox { display: flex; justify-content: center; margin: .4rem 0 .8rem; }
  canvas.qr { width: min(16rem, 100%); height: auto; background: #fff; border-radius: .8rem; }
  .finder { position: relative; overflow: hidden; border-radius: 1rem; background: #000; aspect-ratio: 3 / 4; }
  .finder video { width: 100%; height: 100%; object-fit: cover; }
  .reticle { position: absolute; inset: 16%; border: 2px solid #8dffc1; border-radius: 1rem; box-shadow: 0 0 0 999px rgba(0, 0, 0, .35); }
  .paste { display: flex; gap: .5rem; align-items: center; margin-top: .6rem; }
  .paste input { flex: 1; margin: 0; }
  .paste button { width: auto; margin: 0; padding: .7rem .9rem; white-space: nowrap; }
  code, .mono, .tx-hash, pre.json { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  code, .mono { word-break: break-all; }
  pre.json { box-sizing: border-box; max-width: 100%; margin: .8rem 0; padding: .8rem; overflow: auto; max-height: 40vh; border-radius: .7rem; background: var(--surface); border: 1px solid var(--line); font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  details { margin: .4rem 0; border-top: 1px solid var(--line); padding-top: .75rem; }
  summary { cursor: pointer; font-weight: 700; }
  details.raw { margin: .8rem 0; border: 1px solid var(--line); border-radius: .8rem; background: var(--surface); padding: 0; }
  details.raw summary { padding: .8rem .9rem; }
  details.raw pre.json { margin: 0; border: 0; border-radius: 0; border-top: 1px solid var(--line); }
  .stack { margin-top: .5rem; }
  li { margin: .2rem 0; }
  #log { padding-left: 1.1rem; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 1rem; padding: 1rem 1.1rem 1.15rem; }
  html[data-shell="phone"] main { max-width: 32rem; margin: 0 auto; padding-bottom: calc(6.2rem + env(safe-area-inset-bottom)); }
  html[data-shell="phone"] .top { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin: 0 0 0.8rem; }
  html[data-shell="phone"] .top h1 { min-width: 0; }
  html[data-shell="phone"] .top button.theme {
    flex: none;
    width: auto;
    height: 2rem;
    margin: 0;
    padding: 0 0.7rem;
    border: 1px solid var(--line);
    border-radius: 0.7rem;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 0.8rem;
    font-weight: 650;
    line-height: 1;
    cursor: pointer;
  }
  html[data-shell="phone"] #nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; align-items: center; box-sizing: border-box; width: 100%; gap: .2rem; margin: 0; padding: .4rem .4rem calc(.45rem + env(safe-area-inset-bottom)); background: var(--nav); border-top: 1px solid var(--line); }
  html[data-shell="phone"] #nav .tab { display: block; flex: 1 1 0; min-width: 0; height: 2.75rem; padding: 0 .1rem; overflow: hidden; text-overflow: ellipsis; font-size: .72rem; line-height: 2.75rem; text-align: center; white-space: nowrap; }
  .seg { display: flex; gap: 0.4rem; margin: 0 0 1rem; padding: 0.25rem; background: var(--surface); border: 1px solid var(--line); border-radius: 0.8rem; }
  .seg .tab { flex: 1 1 0; box-sizing: border-box; height: 2.4rem; padding: 0 0.4rem; }
  .settings { display: flex; flex-direction: column; gap: 0.9rem; }
  html[data-shell="desk"] .settings { max-width: 40rem; }
  label.setting { display: flex; flex-direction: column; align-items: stretch; gap: 0.25rem; margin: 0 0 0.9rem; }
  label.setting span { color: var(--muted); font-size: 0.8125rem; font-weight: 650; }
  .kv { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 0.35rem 0.75rem; margin: 0.2rem 0 0.6rem; font-size: 0.8125rem; }
  .kv span:nth-child(odd) { color: var(--muted); }
  .kv span:nth-child(even) { overflow-wrap: anywhere; }
  html[data-shell="desk"] #shell { display: flex; align-items: stretch; }
  html[data-shell="desk"] #nav { width: 15rem; flex: none; display: flex; flex-direction: column; gap: .25rem; padding: 1.1rem .75rem 1rem; border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh; box-sizing: border-box; }
  html[data-shell="desk"] #nav .tab { width: 100%; text-align: left; padding: .7rem .85rem; }
  html[data-shell="desk"] .nav-foot { margin-top: auto; display: grid; grid-template-columns: 1fr; gap: 0.4rem; padding-top: 0.75rem; }
  html[data-shell="desk"] .nav-foot button {
    appearance: none;
    width: 100%;
    height: 2.25rem;
    margin: 0;
    padding: 0 0.35rem;
    border: 1px solid var(--line);
    border-radius: 0.7rem;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 0.8rem;
    font-weight: 650;
    line-height: 1;
    text-align: center;
    cursor: pointer;
  }
  html[data-shell="desk"] .nav-foot button:hover { background: var(--surface-2); color: var(--text); }
  html[data-shell="desk"] .brand { display: flex; flex-direction: column; gap: .15rem; padding: .25rem .85rem 1rem; }
  html[data-shell="desk"] .brand span { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8rem; }
  html[data-shell="desk"] main { flex: 1; min-width: 0; width: auto; max-width: none; margin: 0; box-sizing: border-box; padding: 1.6rem 1.8rem 3rem; }
  html[data-shell="desk"] #shell:has(#nav[hidden]) { display: block; }
  html[data-shell="desk"] #shell:has(#nav[hidden]) main { max-width: 32rem; margin: 0 auto; }
  html[data-shell="desk"] .board {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 22rem;
    grid-template-areas: "hero receive" "activity receive";
    gap: 1.25rem 1.5rem;
    align-items: start;
  }
  html[data-shell="desk"] .hero { grid-area: hero; min-width: 0; }
  html[data-shell="desk"] .card.activity { grid-area: activity; min-width: 0; }
  html[data-shell="desk"] .card.receive { grid-area: receive; min-width: 0; }
  html[data-shell="desk"] .tx-head {
    display: grid;
    grid-template-columns: 9.5rem minmax(0, 1fr) auto;
    column-gap: 1rem;
    padding: 0 0.75rem 0.35rem;
    color: var(--muted);
    font-size: 0.75rem;
    font-weight: 650;
    letter-spacing: 0.04em;
  }
  html[data-shell="desk"] .tx {
    grid-template-columns: 9.5rem minmax(0, 1fr) auto;
    grid-template-areas: "type main end";
    column-gap: 1rem;
    row-gap: 0;
    align-items: center;
    padding: 0.7rem 0.75rem;
  }
  html[data-shell="desk"] .tx-type { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  html[data-shell="desk"] .tx-main { font-size: 0.95rem; color: var(--text); }
  html[data-shell="desk"] .form { max-width: 28rem; }
  html[data-shell="desk"] .split { display: grid; grid-template-columns: auto minmax(0, 26rem); justify-content: start; gap: 1.5rem; align-items: center; }
  html[data-shell="desk"] .finder { width: min(22rem, 100%); aspect-ratio: 1; }
  html[data-shell="desk"] .top { margin-bottom: .8rem; }
  @media (max-width: 960px) {
    html[data-shell="desk"] .board {
      grid-template-columns: 1fr;
      grid-template-areas: "hero" "activity" "receive";
    }
  }
  @media (max-width: 720px) {
    html[data-shell="desk"] #shell { flex-direction: column; }
    html[data-shell="desk"] #nav { width: auto; height: auto; position: sticky; top: 0; flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); }
    html[data-shell="desk"] #nav .brand { width: 100%; }
    html[data-shell="desk"] .nav-foot { margin-top: 0; width: auto; padding-top: 0; grid-template-columns: auto; }
    html[data-shell="desk"] .nav-foot button { width: auto; padding: 0 0.7rem; }
    html[data-shell="desk"] .split { grid-template-columns: 1fr; }
    html[data-shell="desk"] .tx-head { display: none; }
    html[data-shell="desk"] .tx {
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas: "type end" "main end";
      column-gap: 0.75rem;
      row-gap: 0.12rem;
      align-items: baseline;
      padding: 0.7rem 0;
    }
    html[data-shell="desk"] .tx-main { font-size: 0.8125rem; color: var(--muted); }
    html[data-shell="desk"] .tx-main:empty { display: none; }
    html[data-shell="desk"] main { padding: 1rem 1rem 2rem; }
  }
</style>
<script>
try {
  var saved = localStorage.getItem("p256-theme");
  document.documentElement.dataset.theme = saved === "light" ? "light" : "dark";
} catch (e) {
  document.documentElement.dataset.theme = "dark";
}
</script>
</head>
<body>
<div id="shell">
<nav id="nav" hidden></nav>
<main id="app">Loading the wallet…</main>
</div>
<script src="vendor/xrpl-accountlib.js"></script>
<script type="module" src="src/signer-app.mjs"></script>
</body>
</html>
