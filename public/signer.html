<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wallet · Xahau</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0c0f14; color: #e9eef5; font: 16px/1.45 -apple-system, system-ui, sans-serif; }
  #shell { min-height: 100vh; }
  main { max-width: 32rem; margin: 0 auto; padding: 1.25rem 1rem 2rem; }
  h1 { font-size: 1.35rem; margin: 0; letter-spacing: -.02em; }
  h2 { font-size: .95rem; margin: 1.3rem 0 .4rem; color: #c5d0de; }
  p { margin: .4rem 0; }
  button, .go { display: block; width: 100%; box-sizing: border-box; margin: .7rem 0; padding: .9rem 1rem; border: 0; border-radius: .8rem; background: #8dffc1; color: #042; font: inherit; font-weight: 700; text-align: center; cursor: pointer; }
  button.ghost { background: transparent; color: #8dffc1; border: 1px solid #245c40; }
  button.link { width: auto; margin: .7rem 0; padding: 0; background: none; color: #8dffc1; font-weight: 650; }
  button:disabled { opacity: .55; }
  button.tab { appearance: none; -webkit-appearance: none; width: auto; margin: 0; background: transparent; color: #93a0b5; border: 0; font-weight: 650; border-radius: .7rem; line-height: 1.1; }
  button.tab.on { background: #8dffc1; color: #042; }
  #nav[hidden] { display: none !important; }
  input[type="text"], input[type="password"], select { width: 100%; box-sizing: border-box; margin: .35rem 0; padding: .75rem; border-radius: .7rem; border: 1px solid #2c394a; background: #151b24; color: inherit; font: inherit; }
  label { display: flex; gap: .6rem; align-items: flex-start; margin: .8rem 0; }
  .muted { color: #93a0b5; font-size: .88rem; }
  .warn { color: #ffd38a; }
  .lede { font-size: 1.05rem; color: #d5deea; }
  .balance { font-size: 2.6rem; font-weight: 750; letter-spacing: -.03em; margin: .15rem 0 .2rem; }
  .balance span { font-size: 1rem; font-weight: 650; color: #93a0b5; }
  .addr { display: flex; align-items: center; gap: .6rem; margin: .2rem 0 .4rem; }
  .addr .mono { flex: 1; min-width: 0; font-size: .78rem; color: #c5d0de; }
  .addr button { width: auto; margin: 0; padding: .4rem .7rem; font-size: .85rem; }
  .banner { display: flex; align-items: center; justify-content: space-between; gap: .8rem; margin: .8rem 0; padding: .75rem .9rem; border-radius: .9rem; background: #172033; border: 1px solid #31442f; }
  .banner p { margin: 0; }
  .banner button { width: auto; margin: 0; padding: .55rem .9rem; }
  .tx { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding: .7rem 0; border-top: 1px solid #243041; color: inherit; text-decoration: none; }
  a.tx { text-decoration: underline; text-decoration-color: #8dffc1; text-underline-offset: .15rem; }
  .lines { list-style: none; margin: 0 0 .35rem; padding: 0; }
  .lines:empty { display: none; }
  .lines li { font-size: .95rem; font-weight: 650; color: #d5deea; }
  a { color: #8dffc1; }
  .qrbox { display: flex; justify-content: center; margin: .4rem 0 .8rem; }
  canvas.qr { width: min(16rem, 100%); height: auto; background: #fff; border-radius: .8rem; }
  .finder { position: relative; overflow: hidden; border-radius: 1rem; background: #000; aspect-ratio: 3 / 4; }
  .finder video { width: 100%; height: 100%; object-fit: cover; }
  .reticle { position: absolute; inset: 16%; border: 2px solid #8dffc1; border-radius: 1rem; box-shadow: 0 0 0 999px rgba(0, 0, 0, .35); }
  .paste { display: flex; gap: .5rem; align-items: center; margin-top: .6rem; }
  .paste input { flex: 1; margin: 0; }
  .paste button { width: auto; margin: 0; padding: .7rem .9rem; white-space: nowrap; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
  pre.json { box-sizing: border-box; max-width: 100%; margin: .8rem 0; padding: .8rem; overflow: auto; max-height: 40vh; border-radius: .7rem; background: #151b24; border: 1px solid #2c394a; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  details { margin: .4rem 0; border-top: 1px solid #243041; padding-top: .75rem; }
  summary { cursor: pointer; font-weight: 700; }
  details.raw { margin: .8rem 0; border: 1px solid #243041; border-radius: .8rem; background: #151b24; padding: 0; }
  details.raw summary { padding: .8rem .9rem; }
  details.raw pre.json { margin: 0; border: 0; border-radius: 0; border-top: 1px solid #243041; }
  .stack { margin-top: .5rem; }
  li { margin: .2rem 0; }
  #log { padding-left: 1.1rem; }
  html[data-shell="phone"] main { padding-bottom: calc(6.2rem + env(safe-area-inset-bottom)); }
  html[data-shell="phone"] #nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; align-items: center; box-sizing: border-box; width: 100%; gap: .2rem; margin: 0; padding: .4rem .4rem calc(.45rem + env(safe-area-inset-bottom)); background: #10151c; border-top: 1px solid #243041; }
  html[data-shell="phone"] #nav .tab { display: flex; align-items: center; justify-content: center; flex: 1 1 0; min-width: 0; height: 2.75rem; padding: 0 .15rem; font-size: .8rem; white-space: nowrap; }
  html[data-shell="desk"] #shell { display: flex; align-items: stretch; }
  html[data-shell="desk"] #nav { width: 15rem; flex: none; display: flex; flex-direction: column; gap: .25rem; padding: 1.1rem .75rem 1rem; border-right: 1px solid #243041; position: sticky; top: 0; height: 100vh; box-sizing: border-box; }
  html[data-shell="desk"] #nav .tab { width: 100%; text-align: left; padding: .7rem .85rem; }
  html[data-shell="desk"] #nav .layout { margin-top: auto; color: #93a0b5; }
  html[data-shell="desk"] .brand { display: flex; flex-direction: column; gap: .15rem; padding: .25rem .85rem 1rem; }
  html[data-shell="desk"] .brand span { color: #93a0b5; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8rem; }
  html[data-shell="desk"] main { max-width: 52rem; margin: 0; flex: 1; padding: 1.6rem 1.8rem 3rem; }
  html[data-shell="desk"] #shell:has(#nav[hidden]) { display: block; }
  html[data-shell="desk"] #shell:has(#nav[hidden]) main { max-width: 32rem; margin: 0 auto; }
  html[data-shell="desk"] .dash { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(16rem, .85fr); gap: 1rem; align-items: start; }
  html[data-shell="desk"] .card { background: #151b24; border: 1px solid #243041; border-radius: 1rem; padding: 1rem 1.1rem 1.15rem; }
  html[data-shell="desk"] .card h2 { margin: 0 0 .6rem; }
  html[data-shell="desk"] .form { max-width: 28rem; }
  html[data-shell="desk"] .split { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1.25rem; align-items: center; }
  html[data-shell="desk"] .finder { width: min(22rem, 100%); aspect-ratio: 1; }
  html[data-shell="desk"] .top { margin-bottom: .8rem; }
  @media (max-width: 720px) {
    html[data-shell="desk"] #shell { flex-direction: column; }
    html[data-shell="desk"] #nav { width: auto; height: auto; position: sticky; flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid #243041; }
    html[data-shell="desk"] #nav .brand { width: 100%; }
    html[data-shell="desk"] #nav .layout { margin-top: 0; }
    html[data-shell="desk"] .dash, html[data-shell="desk"] .split { grid-template-columns: 1fr; }
    html[data-shell="desk"] main { padding: 1rem 1rem 2rem; }
  }
</style>
</head>
<body>
<div id="shell">
<nav id="nav" hidden></nav>
<main id="app">Loading the wallet…</main>
</div>
<script src="vendor/xrpl-accountlib.js"></script>
<script type="module" src="src/signer-app.mjs"></script>
</body>
</html>
