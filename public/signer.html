<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wallet · Xahau</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0c0f14; color: #e9eef5; font: 16px/1.45 -apple-system, system-ui, sans-serif; }
  #shell { min-height: 100vh; }
  main { max-width: 32rem; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
  h2 { font-size: 1rem; margin: 1.2rem 0 .3rem; }
  p { margin: .4rem 0; }
  button, .go { display: block; width: 100%; box-sizing: border-box; margin: .7rem 0; padding: .9rem 1rem; border: 0; border-radius: .8rem; background: #8dffc1; color: #042; font: inherit; font-weight: 700; text-align: center; }
  button.ghost { background: transparent; color: #8dffc1; border: 1px solid #245c40; }
  button:disabled { opacity: .55; }
  button.tab { width: auto; margin: 0; background: transparent; color: #93a0b5; border: 0; font-weight: 650; }
  button.tab.on { background: #8dffc1; color: #042; }
  #nav[hidden] { display: none; }
  input[type="text"], input[type="password"], select { width: 100%; box-sizing: border-box; margin: .35rem 0; padding: .75rem; border-radius: .7rem; border: 1px solid #2c394a; background: #151b24; color: inherit; }
  label { display: flex; gap: .6rem; align-items: flex-start; margin: .8rem 0; }
  .muted { color: #93a0b5; font-size: .88rem; }
  .warn { color: #ffd38a; }
  .balance { font-size: 2.4rem; font-weight: 750; letter-spacing: -.03em; margin: .2rem 0 .4rem; }
  .balance span { font-size: 1rem; font-weight: 650; color: #93a0b5; }
  .tx { display: flex; justify-content: space-between; gap: 1rem; padding: .65rem 0; border-top: 1px solid #243041; }
  .qrbox { display: flex; justify-content: center; margin: .6rem 0; }
  canvas.qr { width: min(16rem, 100%); height: auto; background: #fff; border-radius: .8rem; }
  .finder { position: relative; overflow: hidden; border-radius: 1rem; background: #000; aspect-ratio: 3 / 4; }
  .finder video { width: 100%; height: 100%; object-fit: cover; }
  .reticle { position: absolute; inset: 16%; border: 2px solid #8dffc1; border-radius: 1rem; box-shadow: 0 0 0 999px rgba(0, 0, 0, .35); }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
  pre.json { margin: .8rem 0; padding: .8rem; overflow: auto; max-height: 70vh; border-radius: .7rem; background: #151b24; border: 1px solid #2c394a; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  li { margin: .2rem 0; }
  #log { padding-left: 1.1rem; }
  html[data-shell="phone"] main { padding-bottom: 6rem; }
  html[data-shell="phone"] #nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; display: flex; gap: .15rem; padding: .35rem .35rem calc(.4rem + env(safe-area-inset-bottom)); background: #10151c; border-top: 1px solid #243041; }
  html[data-shell="phone"] #nav .tab { flex: 1; padding: .7rem .15rem; font-size: .78rem; }
  html[data-shell="desk"] #shell { display: flex; align-items: stretch; }
  html[data-shell="desk"] #nav { width: 14.5rem; flex: none; display: flex; flex-direction: column; gap: .35rem; padding: 1.2rem .8rem; border-right: 1px solid #243041; }
  html[data-shell="desk"] #nav .tab { width: 100%; text-align: left; padding: .75rem .9rem; }
  html[data-shell="desk"] main { max-width: 36rem; }
</style>
</head>
<body>
<div id="shell">
<nav id="nav" hidden></nav>
<main id="app">Loading the wallet…</main>
</div>
<script src="vendor/xrpl-accountlib.js"></script>
<script type="module" src="src/signer-app.mjs"></script>
</body>
</html>
